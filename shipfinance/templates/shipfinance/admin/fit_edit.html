{% extends "shipfinance/base.html" %}
{% block shipfinance_content %}
<h1>{% if fit %}Edit Fit{% else %}New Fit{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" value="{{ fit.name|default:'' }}" required></div>
  <div class="mb-3"><label class="form-label">Hull Type ID</label><input type="number" name="hull_type_id" class="form-control" value="{{ fit.hull_type_id|default:'' }}" required></div>
  <div class="mb-3"><label class="form-label">Hull Type Name</label><input type="text" name="hull_type_name" class="form-control" value="{{ fit.hull_type_name|default:'' }}"></div>
  <div class="mb-3"><label class="form-label">DNA Fitting String</label><textarea name="dna" class="form-control" rows="2">{{ fit.dna|default:'' }}</textarea></div>
  <div class="mb-3"><label class="form-label">Skill Tier</label><input type="text" name="skill_tier" class="form-control" value="{{ fit.skill_tier|default:'' }}" placeholder="e.g. T2, T1, Newbie"></div>
  <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3">{{ fit.description|default:'' }}</textarea></div>
  <div class="mb-3 form-check"><input type="checkbox" name="active" class="form-check-input" id="active" {% if not fit or fit.active %}checked{% endif %}><label class="form-check-label" for="active">Active</label></div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{% url 'shipfinance:admin_fits' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
