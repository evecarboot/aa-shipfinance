{% extends "shipfinance/base.html" %}
{% block shipfinance_content %}
<h1>Audit Log</h1>
<table class="table table-sm table-striped">
  <thead><tr><th>Time</th><th>Action</th><th>By</th><th>Ship</th><th>Detail</th></tr></thead>
  <tbody>
    {% for e in entries %}
    <tr>
      <td>{{ e.created_at|date:"Y-m-d H:i" }}</td>
      <td><code>{{ e.action }}</code></td>
      <td>{{ e.performed_by.username|default:"system" }}</td>
      <td>{{ e.ship_stock|default:"-" }}</td>
      <td>{{ e.detail }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
